# Gateway de la malla de sedes (equivalente al nginx de Compose).
#   /           -> cualquier sede sana (reparto + failover para lecturas)
#   /sede/N/... -> la sede N en concreto
# Los clientes entran por HTTPS (30443); el puerto 30100 solo redirige y expone /healthz.
# Los Services de Kubernetes tienen IP estable, así que (a diferencia de
# Compose) no hay que reiniciar el gateway cuando se recrea una API.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx
  namespace: hc-gateway
data:
  nginx.conf: |
    events {}
    http {
        upstream sedes {
            server api.sede-sincelejo.svc.cluster.local:8001 max_fails=1 fail_timeout=3s;
            server api.sede-cartagena.svc.cluster.local:8001 max_fails=1 fail_timeout=3s;
            server api.sede-corozal.svc.cluster.local:8001   max_fails=1 fail_timeout=3s;
        }
        upstream hsb { server hsb.hc-hsb.svc.cluster.local:8000 max_fails=1 fail_timeout=3s; }
        upstream sede1 { server api.sede-sincelejo.svc.cluster.local:8001; }
        upstream sede2 { server api.sede-cartagena.svc.cluster.local:8001; }
        upstream sede3 { server api.sede-corozal.svc.cluster.local:8001; }

        # Estado interno de nginx para el exportador de métricas (sidecar del mismo pod: solo se alcanza por localhost).
        server {
            listen 127.0.0.1:8081;
            location /stub_status { stub_status; }
        }

        # HTTP solo sirve la sonda de salud y redirige todo lo demás a HTTPS (el token y las claves no deben viajar en claro).
        server {
            listen 80;
            location /healthz { return 200 "ok\n"; }
            location /        { return 308 https://$host:30443$request_uri; }
        }

        server {
            listen 443 ssl;
            ssl_certificate     /etc/nginx/tls/tls.crt;
            ssl_certificate_key /etc/nginx/tls/tls.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_prefer_server_ciphers off;
            ssl_session_cache shared:TLS:2m;
            ssl_session_timeout 10m;
            ssl_session_tickets off;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options nosniff always;

            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
            # El gateway fija estas cabeceras (no las acepta del cliente): la API las usa para el registro de accesos.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;

            # Bus de integración: los sistemas de las sedes envían HL7 v2 y CSV (POST /hsb/hl7, POST /hsb/csv?sede=N) y el personal consulta el estado
            location = /health { default_type application/json; return 200 '{"servicio":"gateway","estado":"ok"}\n'; }
            # Métricas del gateway (conexiones y peticiones) en formato Prometheus, del exportador oficial de nginx (sidecar).
            location = /metrics { proxy_pass http://127.0.0.1:9113; }
            location = /hsb/health  { proxy_pass http://hsb/health; }
            location = /hsb/metrics { proxy_pass http://hsb/metrics; }
            location /hsb/ { proxy_pass http://hsb; client_max_body_size 5m; proxy_read_timeout 60s; }
            location /sede/1/ { proxy_pass http://sede1/; }
            location /sede/2/ { proxy_pass http://sede2/; }
            location /sede/3/ { proxy_pass http://sede3/; }
            location /        { proxy_pass http://sedes; }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: hc-gateway
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{name: http, containerPort: 80}, {name: https, containerPort: 443}]
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: tls, mountPath: /etc/nginx/tls, readOnly: true}
        - name: metricas
          image: nginx/nginx-prometheus-exporter:1.3.0
          args: ["--nginx.scrape-uri=http://127.0.0.1:8081/stub_status"]
          ports: [{name: metricas, containerPort: 9113}]
          resources:
            requests: {cpu: 5m, memory: 12Mi}
            limits: {memory: 48Mi}
      volumes:
        - name: conf
          configMap: {name: gateway-nginx}
        - name: tls
          secret: {secretName: gateway-tls}      # lo crea scripts/k8s_desplegar.sh con scripts/certificados.py
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: hc-gateway
spec:
  type: NodePort
  selector: {app: gateway}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30100}       # solo /healthz y redirección a HTTPS
    - {name: https, port: 443, targetPort: https, nodePort: 30443}
