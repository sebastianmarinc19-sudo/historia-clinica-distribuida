# Sede Corozal (id 3).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sede-corozal

resources:
  - ../../base

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: sede-config
    literals:
      - SEDE_ID=3
      - LOCAL_NAME=corozal
      - "PEERS=sincelejo:pg.sede-sincelejo.svc.cluster.local cartagena:pg.sede-cartagena.svc.cluster.local"

# HAPI FHIR: ~700 MB. En la máquina de laboratorio solo Sincelejo lo tiene
# activo; las demás sedes degradan a "fhir no disponible" y siguen operando.
replicas:
  - name: hapi
    count: 0

patches:
  - target: {kind: Service, name: api-ext}
    patch: |-
      - op: add
        path: /spec/ports/0/nodePort
        value: 30103
