# Sede Sincelejo (id 1).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sede-sincelejo

resources:
  - ../../base

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: sede-config
    literals:
      - SEDE_ID=1
      - LOCAL_NAME=sincelejo
      - "PEERS=cartagena:pg.sede-cartagena.svc.cluster.local corozal:pg.sede-corozal.svc.cluster.local"

# HAPI FHIR: ~700 MB. En la máquina de laboratorio solo Sincelejo lo tiene
# activo; las demás sedes degradan a "fhir no disponible" y siguen operando.
replicas:
  - name: hapi
    count: 1

patches:
  - target: {kind: Service, name: api-ext}
    patch: |-
      - op: add
        path: /spec/ports/0/nodePort
        value: 30101
