# Base de una sede: PostgreSQL + API (2 réplicas) + HAPI FHIR + Job de réplica + respaldo programado.
# Cada overlay (sincelejo, cartagena, corozal) fija el namespace, el id de
# sede y los pares con los que replica.
#
# Se construye con:
#   kubectl kustomize --load-restrictor LoadRestrictionsNone infra/k8s/overlays/sincelejo
# (los scripts SQL viven en ../../../db y se reutilizan tal cual).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - postgres.yaml
  - api.yaml
  - hapi.yaml
  - replicacion-job.yaml
  - respaldo.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: db-init
    files:
      - ../../../db/01_esquema_57_campos.sql
      - ../../../db/02_semillas_catalogos.sql
      - ../../../db/03_replicacion.sh
      - ../../../db/04_fhir_db.sh
  - name: replicacion-script
    files:
      - configurar_suscripciones.sh=../../../scripts/configurar_suscripciones_k8s.sh

# Credenciales de laboratorio. En producción irían en un gestor de secretos.
secretGenerator:
  - name: hc-secretos
    literals:
      - POSTGRES_PASSWORD=admin
      - REPLICATION_PASSWORD=repl_secret
