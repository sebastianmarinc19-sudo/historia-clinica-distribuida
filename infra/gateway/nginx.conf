# Gateway de la malla de sedes.
#   /            -> cualquier sede sana (reparto + failover para lecturas)
#   /sede/N/...  -> la sede N en concreto (para escribir en la sede dueña)
#
# Los clientes entran por HTTPS (host 8443); el 8100 solo redirige. Los certificados los crea el servicio `init` de docker compose
# (o `python3 scripts/certificados.py`). /health es la salud del propio gateway y /metrics son sus métricas en formato Prometheus.
#
# Los POST no se reintentan en otra sede (nginx solo reintenta métodos
# idempotentes): escribir en la sede equivocada devuelve 409 con la dueña.
events {}

http {
    upstream sedes {
        server api_sincelejo:8001 max_fails=1 fail_timeout=3s;
        server api_cartagena:8001 max_fails=1 fail_timeout=3s;
        server api_corozal:8001   max_fails=1 fail_timeout=3s;
    }
    upstream hsb { server hsb:8000 max_fails=1 fail_timeout=3s; }
    upstream sede1 { server api_sincelejo:8001; }
    upstream sede2 { server api_cartagena:8001; }
    upstream sede3 { server api_corozal:8001; }

    # Estado interno de nginx para el exportador de métricas (no se publica en el host: solo lo alcanza la red de Docker).
    server {
        listen 8081;
        location /stub_status { stub_status; }
    }

    # HTTP solo redirige a HTTPS (el token y las claves no deben viajar en claro).
    server {
        listen 80;
        location /healthz { return 200 "ok\n"; }
        location = /health { default_type application/json; return 200 '{"servicio":"gateway","estado":"ok"}\n'; }
        location /        { return 308 https://$host:8443$request_uri; }
    }

    server {
        listen 443 ssl;
        ssl_certificate     /etc/nginx/tls/gateway.crt;
        ssl_certificate_key /etc/nginx/tls/gateway.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:TLS:2m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;

        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
        # El gateway fija estas cabeceras (no las acepta del cliente): la API las usa para el registro de accesos.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        location = /health { default_type application/json; return 200 '{"servicio":"gateway","estado":"ok"}\n'; }
        # Métricas del gateway (conexiones, peticiones) en formato Prometheus, del exportador oficial de nginx. Se resuelve al usarse:
        # si el exportador aún no arrancó, el gateway no se cae.
        location = /metrics {
            resolver 127.0.0.11 valid=10s;
            set $exportador http://gateway_metricas:9113;
            proxy_pass $exportador;
        }

        # Bus de integración: los sistemas de las sedes envían HL7 v2 y CSV (POST /hsb/hl7, POST /hsb/csv?sede=N) y el personal consulta el estado
        location = /hsb/health  { proxy_pass http://hsb/health; }
        location = /hsb/metrics { proxy_pass http://hsb/metrics; }
        location /hsb/ { proxy_pass http://hsb; client_max_body_size 5m; proxy_read_timeout 60s; }
        location /sede/1/ { proxy_pass http://sede1/; }
        location /sede/2/ { proxy_pass http://sede2/; }
        location /sede/3/ { proxy_pass http://sede3/; }
        location /        { proxy_pass http://sedes; }
    }
}
