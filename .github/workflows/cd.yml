# Entrega continua: con una etiqueta vX.Y.Z (o a pedido) se vuelve a correr el CI y, si pasa, se construye la imagen de la API,
# se escanea, se publica en GHCR con SBOM y procedencia, se firma (cosign sin clave) y se empaquetan los manifiestos de
# Kubernetes con la imagen fijada por digest. NO despliega en ningún clúster: no hay uno al que apuntar; el despliegue
# se hace con los manifiestos del release (véase dist/LEEME.txt).
name: CD

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  imagen:
    name: imagen · construir, escanear, publicar y firmar
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write            # firma sin clave (OIDC de GitHub)
    outputs:
      referencia: ${{ steps.ref.outputs.referencia }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - name: Construir (sin publicar) para escanear
        uses: docker/build-push-action@v6
        with:
          context: app
          load: true
          tags: hc-api:escaneo
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Escanear vulnerabilidades (falla con CRITICAL que ya tengan corrección)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: hc-api:escaneo
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Publicar con SBOM y procedencia
        id: push
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
      - id: ref
        run: echo "referencia=ghcr.io/${GITHUB_REPOSITORY,,}/api@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
      - name: Firmar la imagen por digest
        run: cosign sign --yes "${{ steps.ref.outputs.referencia }}"

  manifiestos:
    name: manifiestos · empaquetar con la imagen fijada
    needs: imagen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write            # adjuntar al release de la etiqueta
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/empaquetar_manifiestos.sh "${{ needs.imagen.outputs.referencia }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: manifiestos-k8s
          path: dist/
      - name: Adjuntar al release (solo con etiqueta)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar czf manifiestos-k8s.tar.gz -C dist .
          gh release create "$GITHUB_REF_NAME" manifiestos-k8s.tar.gz --generate-notes --verify-tag \
            || gh release upload "$GITHUB_REF_NAME" manifiestos-k8s.tar.gz --clobber
